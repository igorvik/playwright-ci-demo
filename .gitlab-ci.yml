image: mcr.microsoft.com/playwright:v1.63.0-noble

stages:
  - verify

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

playwright:
  stage: verify
  timeout: 15 minutes
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm run audit
    - npm test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - playwright-report/
    reports:
      junit: test-results/junit.xml
